<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 920" width="100%" height="100%">
  <defs>
    <!-- Radiant 24K Gold Gradients -->
    <linearGradient id="goldAuraCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="20%" stop-color="#ffd700"/>
      <stop offset="45%" stop-color="#fffbe6"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    
    <linearGradient id="goldAuraText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff2a8"/>
      <stop offset="70%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <radialGradient id="goldLiquidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe680" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffbf00" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#b8860b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#543d04" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="goldGlassReflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="8%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="20%" stop-color="#fffbee" stop-opacity="0.05"/>
      <stop offset="80%" stop-color="#fffbee" stop-opacity="0.05"/>
      <stop offset="92%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="goldBevelL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffd700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldBevelR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffd700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldLabelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9cc"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#7a5405"/>
    </linearGradient>

    <filter id="celestialRadiance" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#ffd700" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g filter="url(#celestialRadiance)">
    <!-- ==================== CAP & CROWN ==================== -->
    <g id="crownCap">
      <path d="M125,45 L135,18 L265,18 L275,45 Z" fill="url(#goldAuraCap)" stroke="#fff" stroke-width="1.8"/>
      
      <!-- Crown Facets -->
      <path d="M135,18 L142,50 L125,50 Z" fill="#b8860b"/>
      <path d="M142,18 L152,18 L160,50 L142,50 Z" fill="#e6b800"/>
      <path d="M152,18 L170,18 L178,50 L160,50 Z" fill="#ffea80"/>
      <path d="M170,18 L190,18 L196,50 L178,50 Z" fill="#ffffff"/>
      <path d="M190,18 L210,18 L214,50 L196,50 Z" fill="#ffffff"/>
      <path d="M210,18 L230,18 L232,50 L214,50 Z" fill="#ffea80"/>
      <path d="M230,18 L248,18 L248,50 L232,50 Z" fill="#e6b800"/>
      <path d="M248,18 L258,18 L258,50 L248,50 Z" fill="#b8860b"/>
      <path d="M258,18 L265,18 L275,50 L258,50 Z" fill="#805d00"/>

      <!-- Middle cap collar ring -->
      <rect x="123" y="48" width="154" height="28" rx="3" fill="url(#goldAuraCap)" stroke="#fff" stroke-width="1.8"/>
      <rect x="127" y="58" width="146" height="4" fill="#ffffff"/>

      <!-- Fluted Lower Cap Base -->
      <path d="M125,76 L130,122 L270,122 L275,76 Z" fill="url(#goldAuraCap)" stroke="#fff" stroke-width="1.8"/>
      <line x1="145" y1="76" x2="148" y2="122" stroke="#b8860b" stroke-width="2"/>
      <line x1="165" y1="76" x2="167" y2="122" stroke="#ffd700" stroke-width="2"/>
      <line x1="185" y1="76" x2="186" y2="122" stroke="#ffffff" stroke-width="2"/>
      <line x1="200" y1="76" x2="200" y2="122" stroke="#ffffff" stroke-width="3"/>
      <line x1="215" y1="76" x2="214" y2="122" stroke="#ffffff" stroke-width="2"/>
      <line x1="235" y1="76" x2="233" y2="122" stroke="#ffd700" stroke-width="2"/>
      <line x1="255" y1="76" x2="252" y2="122" stroke="#b8860b" stroke-width="2"/>
    </g>

    <!-- ==================== NECK & GOLD WRAP ==================== -->
    <g id="neckSection">
      <rect x="130" y="122" width="140" height="15" fill="#543d04"/>
      <!-- Brilliant 24K Gold foil collar -->
      <rect x="127" y="137" width="146" height="92" rx="2" fill="url(#goldAuraCap)" stroke="#ffffff" stroke-width="1.8"/>
      <!-- White/Gold accent stripes -->
      <rect x="127" y="142" width="146" height="4" fill="#ffffff"/>
      <rect x="127" y="221" width="146" height="5" fill="#ffffff"/>
      <rect x="127" y="217" width="146" height="2" fill="#fffbe6"/>

      <!-- Collar Logo: THE INDIAN EDIT -->
      <text x="200" y="167" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" font-weight="700" fill="#664606" text-anchor="middle" letter-spacing="3">THE</text>
      <text x="200" y="191" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="24" font-weight="800" fill="#4d3504" text-anchor="middle" letter-spacing="3">INDIAN</text>
      <line x1="148" y1="202" x2="175" y2="202" stroke="#664606" stroke-width="1.5"/>
      <text x="200" y="206" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#4d3504" text-anchor="middle" letter-spacing="4">EDIT</text>
      <line x1="225" y1="202" x2="252" y2="202" stroke="#664606" stroke-width="1.5"/>

      <!-- Lower Glass Neck Swell -->
      <path d="M129,229 C129,265 105,290 68,310 L332,310 C295,290 271,265 271,229 Z" fill="#543d04"/>
      <path d="M136,233 C136,260 115,285 85,305 L315,305 C285,285 264,260 264,233 Z" fill="#ffbf00" opacity="0.9"/>
    </g>

    <!-- ==================== BOTTLE BODY & LIQUID GOLD ==================== -->
    <g id="bottleBody">
      <!-- Main glass container outer contour -->
      <rect x="42" y="308" width="316" height="570" rx="14" fill="#382902" stroke="#ffd700" stroke-width="3"/>

      <!-- Liquid Gold Core -->
      <rect x="46" y="312" width="308" height="540" rx="10" fill="url(#goldLiquidGlow)"/>

      <!-- Refraction highlights -->
      <rect x="46" y="312" width="40" height="540" fill="url(#goldBevelL)"/>
      <rect x="314" y="312" width="40" height="540" fill="url(#goldBevelR)"/>

      <!-- Heavy Crystal Base with Gold Gilding -->
      <path d="M46,845 L354,845 L354,872 C354,878 348,882 342,882 L58,882 C52,882 46,878 46,872 Z" fill="#291e01" stroke="#ffffff" stroke-width="2"/>
      <line x1="52" y1="850" x2="348" y2="850" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="60" y1="872" x2="340" y2="872" stroke="#ffd700" stroke-width="2.5"/>
      <line x1="80" y1="862" x2="320" y2="862" stroke="#fffbe6" stroke-width="1.8"/>

      <!-- Embossed Glass Base Text: THE INDIAN -->
      <text x="200" y="818" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="28" font-weight="800" fill="#ffffff" stroke="#ffd700" stroke-width="1.2" text-anchor="middle" letter-spacing="9">THE INDIAN</text>

      <!-- Glass Specular Reflection -->
      <rect x="46" y="312" width="308" height="555" rx="10" fill="url(#goldGlassReflect)" pointer-events="none"/>
    </g>

    <!-- ==================== BRANDING & CENTRAL GOLD EMBLEM ==================== -->
    <g id="bottleBranding">
      <text x="200" y="390" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="26" font-weight="800" fill="#ffffff" stroke="#996515" stroke-width="0.8" text-anchor="middle" letter-spacing="4">THE</text>
      
      <!-- Stylized "INDIAN" in Platinum & Gold -->
      <g transform="translate(200, 442)">
        <text x="0" y="0" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="56" font-weight="800" fill="#ffffff" stroke="#996515" stroke-width="1" text-anchor="middle" letter-spacing="4">INDIAN</text>
        <path d="M12,-18 C16,-3 22,2 29,2" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- EDIT -->
      <line x1="90" y1="472" x2="165" y2="472" stroke="#ffffff" stroke-width="2.5"/>
      <text x="200" y="477" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="8">EDIT</text>
      <line x1="235" y1="472" x2="310" y2="472" stroke="#ffffff" stroke-width="2.5"/>

      <!-- ==================== 24K GOLD DIAMOND LOZENGE EMBLEM ==================== -->
      <g id="diamondEmblem" transform="translate(200, 620)">
        <!-- Outer border diamond -->
        <polygon points="0,-105 115,0 0,105 -115,0" fill="#4d3504" stroke="#ffffff" stroke-width="4.5"/>
        
        <!-- Inner gold foil fill diamond -->
        <polygon points="0,-98 107,0 0,98 -107,0" fill="url(#goldLabelGrad)"/>
        <polygon points="0,-93 102,0 0,93 -102,0" fill="none" stroke="#ffffff" stroke-width="2"/>

        <!-- Elephant Crest in Regal Bronze/Dark Gold -->
        <ellipse cx="0" cy="-48" rx="8" ry="6" fill="#3d2802"/>
        <line x1="-8" y1="-48" x2="8" y2="-48" stroke="#ffd700" stroke-width="1.2"/>
        <line x1="0" y1="-54" x2="0" y2="-42" stroke="#ffd700" stroke-width="1.2"/>
        
        <g fill="#3d2802" transform="translate(0, -66)">
          <path d="M-8,14 C-10,14 -12,12 -12,8 C-12,4 -8,0 -2,0 C3,0 10,2 12,6 C13,8 14,10 14,13 C14,14 13,15 12,15 C11,15 10,14 10,13 C10,9 6,6 2,6 C-1,6 -3,8 -3,11 C-3,13 -2,14 0,14 C1,14 2,15 2,16 C2,17 0,18 -2,18 C-4,18 -6,16 -6,14 Z"/>
          <path d="M-12,8 C-15,8 -17,10 -17,14 L-17,19 L-14,19 L-14,15 C-13,12 -10,11 -9,11 Z"/>
          <path d="M-8,12 L-8,19 L-5,19 L-5,14 Z"/>
          <path d="M6,12 L6,19 L9,19 L9,14 Z"/>
          <path d="M11,13 L11,19 L14,19 L14,14 Z"/>
          <circle cx="8" cy="6" r="0.8" fill="#ffd700"/>
          <path d="M-4,3 L6,3 L5,7 L-3,7 Z" fill="#ffffff" stroke="#3d2802" stroke-width="0.5"/>
        </g>

        <!-- Filigree Swirls -->
        <path d="M-55,-22 C-35,-32 -20,-12 -5,-25 C10,-12 25,-32 45,-22" fill="none" stroke="#4d3504" stroke-width="2.2"/>
        <circle cx="-55" cy="-22" r="3" fill="#4d3504"/>
        <circle cx="45" cy="-22" r="3" fill="#4d3504"/>
        <circle cx="0" cy="-25" r="2.5" fill="#4d3504"/>

        <!-- Pill Ribbon: GOLD EDITION -->
        <g transform="translate(0, -6)">
          <rect x="-85" y="-12" width="170" height="22" rx="11" fill="#382402" stroke="#ffffff" stroke-width="1.8"/>
          <text x="0" y="3" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="11" font-weight="900" fill="#ffd700" text-anchor="middle" letter-spacing="2">GOLD EDITION WHISKY</text>
        </g>

        <!-- Blend Story Text -->
        <text x="0" y="24" font-family="'Cormorant Garamond', serif" font-size="8.5" font-style="italic" font-weight="700" fill="#3d2802" text-anchor="middle">A blend of Indian Malt and Grain</text>
        <text x="0" y="36" font-family="'Cormorant Garamond', serif" font-size="8.5" font-style="italic" font-weight="700" fill="#3d2802" text-anchor="middle">Spirits with the finest Scotch Malts.</text>

        <!-- Lower Filigree Swirls -->
        <path d="M-42,48 C-25,38 -15,55 0,46 C15,55 25,38 42,48" fill="none" stroke="#4d3504" stroke-width="2"/>

        <!-- CRAFTED IN INDIA -->
        <text x="0" y="63" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#3d2802" text-anchor="middle" letter-spacing="2">CRAFTED</text>
        <text x="0" y="72" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#3d2802" text-anchor="middle" letter-spacing="2">IN INDIA</text>
        <circle cx="0" cy="81" r="5" fill="none" stroke="#4d3504" stroke-width="1.5"/>
        <circle cx="0" cy="81" r="2.2" fill="#4d3504"/>
      </g>
    </g>

    <!-- Shimmering Star Sparkles on Bottle -->
    <g transform="translate(68, 335)" fill="#ffffff" opacity="0.9">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3"/>
    </g>
    <g transform="translate(325, 480)" fill="#ffffff" opacity="0.95">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
    </g>
    <g transform="translate(85, 780)" fill="#ffffff" opacity="0.85">
      <polygon points="0,-10 2.5,-2.5 10,0 2.5,2.5 0,10 -2.5,2.5 -10,0 -2.5,-2.5"/>
    </g>
  </g>
</svg>
