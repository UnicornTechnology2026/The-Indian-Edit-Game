<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73a942"/>
      <stop offset="40%" stop-color="#3b7a2e"/>
      <stop offset="80%" stop-color="#1b4918"/>
      <stop offset="100%" stop-color="#0f2b0d"/>
    </linearGradient>

    <linearGradient id="leafBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fced98"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6921"/>
    </linearGradient>

    <filter id="leafGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#73a942" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#leafGlow)">
    <!-- Terracotta & Gold Circular Plaque Base -->
    <circle cx="80" cy="80" r="68" fill="#30160b" stroke="url(#leafBorderGrad)" stroke-width="2.5"/>
    <circle cx="80" cy="80" r="60" fill="#1e1008" stroke="#73a942" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Handcrafted Bodhi / Organic Leaf Motif -->
    <path d="M80,30 C105,48 118,72 108,102 C100,120 84,128 80,132 C76,128 60,120 52,102 C42,72 55,48 80,30 Z" fill="url(#leafGrad)" stroke="url(#leafBorderGrad)" stroke-width="2"/>

    <!-- Central Vein & Leaf Branching -->
    <path d="M80,36 L80,128" stroke="#fff8d9" stroke-width="2" fill="none"/>
    <path d="M80,55 Q95,62 100,70" stroke="#fff8d9" stroke-width="1.5" fill="none"/>
    <path d="M80,55 Q65,62 60,70" stroke="#fff8d9" stroke-width="1.5" fill="none"/>
    <path d="M80,75 Q96,82 102,90" stroke="#fff8d9" stroke-width="1.5" fill="none"/>
    <path d="M80,75 Q64,82 58,90" stroke="#fff8d9" stroke-width="1.5" fill="none"/>
    <path d="M80,95 Q92,100 95,108" stroke="#fff8d9" stroke-width="1.5" fill="none"/>
    <path d="M80,95 Q68,100 65,108" stroke="#fff8d9" stroke-width="1.5" fill="none"/>

    <!-- Label -->
    <text x="80" y="148" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="800" fill="#fced98" text-anchor="middle" letter-spacing="1">SUSTAINABLE +10</text>
  </g>
</svg>
