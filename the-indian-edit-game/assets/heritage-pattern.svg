<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="patternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.03"/>
    </radialGradient>
  </defs>
  <!-- Background transparent -->
  <g stroke="#d4af37" stroke-width="0.75" fill="none" opacity="0.35">
    <!-- Center 8-pointed star & mandala petal -->
    <circle cx="60" cy="60" r="18"/>
    <circle cx="60" cy="60" r="32"/>
    <circle cx="60" cy="60" r="48" stroke-dasharray="2,4"/>
    
    <!-- 8 Petals radiating -->
    <path d="M60,42 C54,50 54,70 60,78 C66,70 66,50 60,42 Z"/>
    <path d="M42,60 C50,54 70,54 78,60 C70,66 50,66 42,60 Z"/>
    <path d="M47,47 C57,49 69,61 73,73 C61,69 49,57 47,47 Z"/>
    <path d="M73,47 C69,57 57,69 47,73 C49,61 61,49 73,47 Z"/>

    <!-- Corner Jaali arches -->
    <path d="M0,0 C20,10 30,30 30,60 C30,90 20,110 0,120"/>
    <path d="M120,0 C100,10 90,30 90,60 C90,90 100,110 120,120"/>
    <path d="M0,0 C10,20 30,30 60,30 C90,30 110,20 120,0"/>
    <path d="M0,120 C10,100 30,90 60,90 C90,90 110,100 120,120"/>

    <!-- Diamonds at corner intersections -->
    <polygon points="0,60 10,50 20,60 10,70" fill="#d4af37" fill-opacity="0.1"/>
    <polygon points="120,60 110,50 100,60 110,70" fill="#d4af37" fill-opacity="0.1"/>
    <polygon points="60,0 50,10 60,20 70,10" fill="#d4af37" fill-opacity="0.1"/>
    <polygon points="60,120 50,110 60,100 70,110" fill="#d4af37" fill-opacity="0.1"/>
  </g>
</svg>
